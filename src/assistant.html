<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>AI 비서</title>
<link rel="stylesheet" href="assistant.css">
</head>
<body>
<header>
  <h1><span class="spark">✦</span> AI 비서</h1>
  <span id="status" class="status"></span>
</header>

<main>
  <section id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="파일 선택">
    <p class="big">사진 · 문서 · 녹음 파일을 여기로 끌어다 놓으세요</p>
    <p class="small">공문, 가정통신문, 회의 녹음, 알림장 사진 등에서 일정·할 일·마감을 찾아 캘린더에 넣어 드립니다.</p>
    <p class="small types">HWP · HWPX · PDF · DOCX · TXT · JPG · PNG · HEIC · MP3 · M4A · WAV</p>
    <button type="button" id="pick">파일 선택</button>
  </section>

  <ul id="files" class="files"></ul>

  <div class="ask">
    <input id="instruction" placeholder="추가 요청 (선택) — 예: 3학년 관련 일정만, 학부모 대상 행사는 빼 줘" autocomplete="off">
    <button type="button" id="run" class="primary" disabled>분석하기</button>
  </div>

  <div id="results"></div>
</main>

<footer id="bar" hidden>
  <span id="barText"></span>
  <span class="sp"></span>
  <button type="button" id="undo" hidden>되돌리기</button>
  <button type="button" id="addSel" class="primary">선택한 일정 추가</button>
</footer>
<script src="assistant.js"></script>
</body>
</html>
