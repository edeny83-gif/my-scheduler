<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="widget.css">
</head>
<body>
<div class="panel" id="panel">
  <header class="bar">
    <div class="title">
      <span id="month" class="month"></span><span class="unit">월</span>
      <span id="year" class="year"></span>
      <span id="sync" class="sync" role="button" tabindex="0" aria-label="동기화 상태"></span>
    </div>
    <div class="tools">
      <button id="prev" title="이전 달" aria-label="이전 달">‹</button>
      <button id="today">오늘</button>
      <button id="next" title="다음 달" aria-label="다음 달">›</button>
      <button id="add" title="일정 추가" aria-label="일정 추가">＋</button>
      <button id="assist" title="AI 비서: 사진·문서·녹음으로 일정 만들기" aria-label="AI 비서">✦</button>
      <button id="gear" title="설정" aria-label="설정">⚙</button>
    </div>
  </header>

  <div class="dow" id="dow"></div>
  <div class="grid" id="grid"></div>

  <section class="list" id="list">
    <div class="list-head">
      <span id="listTitle"></span>
      <button id="listAdd" title="이 날에 일정 추가" aria-label="이 날에 일정 추가">＋</button>
    </div>
    <ul id="listItems"></ul>
  </section>

  <section class="quick" id="quick">
    <div class="qres" id="qres" hidden></div>
    <form class="qbar" id="qform" autocomplete="off">
      <input id="qtext" placeholder="✦ 예: 다음 주 화요일 3시 학부모 상담" aria-label="일정 빠른 입력">
      <button type="button" id="qmic" title="말로 입력 (다시 누르면 끝)" aria-label="말로 입력">🎤</button>
      <button type="submit" id="qsend" title="일정 넣기" aria-label="일정 넣기">↑</button>
    </form>
  </section>

  <div class="drop" id="drop"><div><b>✦</b><span>여기에 놓으면 AI 비서가<br>일정을 찾아 드립니다</span></div></div>

  <div class="rz n" data-edge="n"></div><div class="rz s" data-edge="s"></div>
  <div class="rz e" data-edge="e"></div><div class="rz w" data-edge="w"></div>
  <div class="rz ne" data-edge="ne"></div><div class="rz nw" data-edge="nw"></div>
  <div class="rz se" data-edge="se"></div><div class="rz sw" data-edge="sw"></div>
</div>

<dialog id="form">
  <form id="f" novalidate>
    <div class="form-head">
      <h3 id="ftitle">일정 추가</h3>
      <span id="fsource" class="source"></span>
    </div>
    <input id="t" placeholder="일정 제목" autocomplete="off">
    <label class="check"><input type="checkbox" id="ad"> 하루 종일</label>
    <div class="when">
      <span class="lbl">시작</span><input type="date" id="sd"><input type="time" id="st">
      <span class="lbl">종료</span><input type="date" id="ed"><input type="time" id="et">
    </div>
    <input id="loc" placeholder="장소">
    <textarea id="memo" placeholder="메모" rows="1"></textarea>

    <div class="field">
      <span class="lbl">글자색</span>
      <div class="swatches" id="swatches"></div>
    </div>
    <div class="field">
      <span class="lbl" title="시작 전 알림">알림</span>
      <div class="chips" id="remind"></div>
    </div>
    <p id="ferr" class="err" role="alert"></p>
    <div class="actions">
      <button type="button" id="del" class="danger">삭제</button>
      <span class="sp"></span>
      <button type="button" id="cancel">닫기</button>
      <button type="submit" id="save" class="primary">저장</button>
    </div>
  </form>
</dialog>
<script src="widget.js"></script>
</body>
</html>
